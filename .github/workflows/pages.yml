name: Publish independent Quran web reader
on:
  push:
    branches: [github-pages-web]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scan extraction dependencies
        run: python -m pip install PyMuPDF==1.26.6 Pillow==11.3.0
      - name: Build and verify the complete reader
        run: python scripts/build-pages.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/web
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
