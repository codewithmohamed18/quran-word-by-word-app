name: Build and publish Android and iOS
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact supplied APK and extract offline content
        run: python scripts/prepare.py
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
  ios:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Extract the same offline content
        run: python3 scripts/prepare.py
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate
      - name: Build iPhone app without signing
        run: |
          cd ios
          xcodebuild -project TajweedMeaning.xcodeproj -scheme TajweedMeaning -configuration Release -sdk iphoneos -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO build
          mkdir -p build/package/Payload
          cp -R build/device/Build/Products/Release-iphoneos/TajweedMeaning.app build/package/Payload/
          cd build/package
          zip -qr ../../../dist/Tajweed-and-Meaning-iOS-UNSIGNED.ipa Payload
      - name: Test on an iPhone simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x["name"].startswith("iPhone")))')
          cd ios
          xcodebuild -project TajweedMeaning.xcodeproj -scheme TajweedMeaning -configuration Debug -destination "id=$DEVICE" -derivedDataPath build/simulator -resultBundlePath build/ReaderTests.xcresult CODE_SIGNING_ALLOWED=NO test
          ditto -c -k --sequesterRsrc --keepParent build/simulator/Build/Products/Debug-iphonesimulator/TajweedMeaning.app ../dist/Tajweed-and-Meaning-iOS-Simulator.zip
      - name: Optional signed iOS export
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -n "$APPLE_CERTIFICATE_P12_BASE64" ] && [ -n "$APPLE_PROVISIONING_PROFILE_BASE64" ]; then
            bash scripts/sign-ios.sh
          else
            echo 'Apple signing is not configured. The unsigned IPA is for signing locally; it cannot be installed directly.'
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/*iOS*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results
          path: ios/build/ReaderTests.xcresult
          if-no-files-found: ignore
  release:
    needs: [android, ios]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: downloads
      - uses: actions/download-artifact@v4
        with:
          name: ios
          path: downloads
      - name: Publish GitHub download release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="v1.7-${GITHUB_RUN_NUMBER}"
          cat > release-notes.md <<'EOF'
          Android: download Tajweed-and-Meaning-v1.7-Soft-Cream.apk. This is the exact supplied signed APK, unchanged.

          iPhone/iPad: the UNSIGNED IPA needs signing with your own Apple account before installation. It is not a direct install download. The Simulator ZIP runs in Xcode's iOS Simulator, not on a phone. If Apple signing secrets are configured, a separate signed IPA is included and works only for devices allowed by that provisioning profile.

          For general public iPhone installation, distribute through TestFlight or the App Store using an Apple Developer account. The complete iOS source is in this repository.
          EOF
          gh release create "$TAG" downloads/* --target "$GITHUB_SHA" --title 'Tajweed & Meaning 1.7 — Android and iOS' --notes-file release-notes.md --latest
