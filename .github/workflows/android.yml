name: Build Android APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare included Qur’an
        run: |
          python -m pip install pypdf==6.1.1
          python scripts/prepare_quran.py
      - name: Test, lint and build debug APK
        run: bash ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: quran-word-by-word-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Free space for emulator
        run: |
          # These runner tools are unused by this Kotlin Android project.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android/sdk/ndk
          df -h /home/runner
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Offline reader device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          target: default
          profile: pixel_2
          disk-size: 2048M
          emulator-boot-timeout: 300
          disable-animations: true
          script: |
            adb shell svc wifi disable
            adb shell svc data disable
            bash ./gradlew --no-daemon connectedDebugAndroidTest
            adb pull /sdcard/Android/data/com.codewithmohamed.quranwordbyword/files/screenshots app/build/reports/device-screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-check-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
            app/build/reports/androidTests/
            app/build/reports/device-screenshots/
          if-no-files-found: ignore
